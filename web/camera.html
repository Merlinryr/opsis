<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>webar camera</title>
<style>
  body { margin: 0; background: #000; color: #fff; font: 13px/1.4 ui-monospace, monospace; }
  canvas#view { display: block; width: 100vw; height: auto; max-height: 100vh; object-fit: contain; }
  #hud { position: fixed; top: 0; left: 0; margin: 0; padding: 6px 8px; background: #000a; white-space: pre; }
  #start { position: fixed; inset: 0; margin: auto; width: 14em; height: 3em; font: inherit; font-size: 16px; }
</style>
<video id="video" playsinline muted hidden></video>
<canvas id="view"></canvas>
<canvas id="gl" width="1" height="1" hidden></canvas>
<pre id="hud">loading…</pre>
<button id="start" hidden>Start camera</button>
<script type="module">
  import init, { Tracker } from "../pkg/webar.js";
  const $ = (id) => document.getElementById(id);
  const hud = $("hud"), video = $("video"), view = $("view");
  const params = new URLSearchParams(location.search);
  const MAX_SIDE = 640; // processing size; level 0 of the pyramid
  const FOV = Number(params.get("fov") ?? 69); // degrees across the long side; tune until the grid holds when turning
  const DELAY = Number(params.get("delay") ?? 0); // ms the sensor leads the camera; tune until the grid holds when turning fast
  const RECORD = params.get("record") === "1"; // ?record=1: upload luma + sensor angles (server needs WEBAR_RECORD=1)
  const LEVELS = Number(params.get("levels") ?? 0); // ?levels=n: diagnostic, pyramid levels (default 4)
  const SRC_VIDEO = params.get("src") === "video"; // ?src=video: the tracker copies the video frame itself (no canvas copy)
  const FPS = Number(params.get("fps") ?? 0); // ?fps=60: ask the camera for that frame rate
  const VISION = params.get("vision") !== "0"; // ?vision=0: sensor rotation only, to tune fov and delay over a fixed grid
  const COLORS = ["#ff3b30", "#ffcc00", "#34c759", "#0a84ff"];
  const STATES = ["initializing: tilt down at the floor", "normal", "limited", "lost"];

  await init();
  const webgpu = params.get("backend") !== "webgl" && !!navigator.gpu && !!(await navigator.gpu.requestAdapter());
  hud.textContent = `ready (${webgpu ? "webgpu" : "webgl2"}). Params: ?backend=webgl ?fov=${FOV} ?delay=${DELAY} ?vision=${+VISION}`;
  $("start").hidden = false;

  // Timestamped sensor samples; the frame picks the one nearest its capture time (no angle interpolation:
  // Euler angles are singular in upright portrait).
  const samples = [];
  addEventListener("deviceorientation", (e) => {
    if (e.alpha === null) return;
    samples.push({ t: performance.now(), a: e.alpha, b: e.beta, g: e.gamma }); // stamped on receipt: one clock with the frames
    if (samples.length > 60) samples.shift();
  });
  // Gravity-free acceleration (m/s^2, device axes) for metric scale; same nearest-sample pick as orientation.
  const motion = [];
  addEventListener("devicemotion", (e) => {
    const a = e.acceleration;
    if (a?.x == null) return;
    motion.push({ t: performance.now(), x: a.x, y: a.y, z: a.z });
    if (motion.length > 120) motion.shift();
  });
  const motionAt = (t) => motion.reduce((best, s) => (!best || Math.abs(s.t - t) < Math.abs(best.t - t) ? s : best), null);
  const sensorAt = (t) => samples.reduce((best, s) => (!best || Math.abs(s.t - t) < Math.abs(best.t - t) ? s : best), null);

  $("start").onclick = async () => {
    // iOS: must be the first call in the gesture, before any await.
    const perm = window.DeviceOrientationEvent?.requestPermission?.() ?? Promise.resolve("granted");
    window.DeviceMotionEvent?.requestPermission?.().catch(() => {}); // iOS: same gesture; scale stays unknown if denied
    $("start").hidden = true;
    try {
      const sensorOk = (await perm) === "granted";
      video.srcObject = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 }, ...(FPS ? { frameRate: { ideal: FPS } } : {}) }, audio: false,
      });
      await video.play();
      const tracker = await Tracker.create($("gl"), webgpu, FOV);
      if (LEVELS) tracker.set_levels(LEVELS);
      const k = MAX_SIDE / Math.max(video.videoWidth, video.videoHeight);
      const w = Math.round(video.videoWidth * k), h = Math.round(video.videoHeight * k);
      view.width = w; view.height = h;
      const ctx = view.getContext("2d");
      ctx.lineWidth = 2;
      // Pixels come from a hidden canvas so the visible one only ever shows a frame with its overlay
      // (the browser presents during the await, which would show the frame before it is drawn).
      // No willReadFrequently: that keeps the canvas on the CPU; the GPU copies it straight into a texture.
      const work = new OffscreenCanvas(w, h).getContext("2d");
      let emaMs = 0, emaFps = 0, emaSplit = [], last = performance.now(), anchor = null, tracked = 0; // tracked: time of the last Normal/Limited frame

      // Project world point X with pose array p (see Tracker.pose); null if behind the camera.
      const project = (p, X) => {
        const d = [X[0] - p[3], X[1] - p[4], X[2] - p[5]];
        const c = [0, 1, 2].map((j) => p[6 + j] * d[0] + p[9 + j] * d[1] + p[12 + j] * d[2]); // R^T d
        return c[2] > 0.05 ? [p[15] * c[0] / c[2] + p[16], p[15] * c[1] / c[2] + p[17]] : null;
      };
      const line = (p, A, B, n = 1) => {
        for (let i = 0; i < n; i++) {
          const lerp = (t) => A.map((a, j) => a + (B[j] - a) * t);
          const u = project(p, lerp(i / n)), v = project(p, lerp((i + 1) / n));
          if (u && v) { ctx.moveTo(...u); ctx.lineTo(...v); }
        }
      };

      let driver = "rAF", gotVfc = false, sent = 0, acked = 0, failed = 0;
      const recSession = Date.now(); // one recordings/ dir per page load
      const frame = async (now, meta) => {
        if (meta) { gotVfc = true; driver = "video frames"; }
        try {
        const tc = performance.now();
        work.drawImage(video, 0, 0, w, h);
        const tFrame = meta?.captureTime ?? meta?.expectedDisplayTime ?? now;
        const want = tFrame - DELAY;
        const s = sensorOk ? sensorAt(want) : null;
        const m = motionAt(want);
        const t0 = performance.now(); // before the recording readback so `copy` stays the drawImage alone
        if (RECORD && s && sent < 300) {
          // Same integer luma as the GPU pass, so the replay sees exactly what the tracker saw.
          const rgba = work.getImageData(0, 0, w, h).data; // recording only: the tracker reads the canvas on the GPU
          const luma = new Uint8Array(w * h);
          for (let i = 0; i < luma.length; i++) luma[i] = (77 * rgba[4 * i] + 150 * rgba[4 * i + 1] + 29 * rgba[4 * i + 2]) >> 8;
          // Capture index + time travel with the frame: uploads can land out of order. Count acks, not sends.
          fetch(`/rec?s=${recSession}&i=${sent++}&t=${tFrame}&w=${w}&h=${h}&a=${s.a}&b=${s.b}&g=${s.g}&fov=${FOV}${m ? `&ax=${m.x}&ay=${m.y}&az=${m.z}` : ""}`, { method: "POST", body: luma })
            .then((r) => (r.ok ? acked++ : failed++), () => failed++);
        }
        // Same frame callback, before the first await: the canvas still shows the frame the tracker copies.
        const kps = await tracker.detect(SRC_VIDEO ? video : work.canvas, w, h, s ? s.a : NaN, s ? s.b : NaN, s ? s.g : NaN, screen.orientation?.angle ?? 0, tFrame, m ? m.x : NaN, m ? m.y : NaN, m ? m.z : NaN, VISION);
        const ms = performance.now() - t0;
        // [canvas copy, frame upload, GPU encode, GPU wait + readback, track, (WebGPU) submit, gpu, map, unpack].
        emaSplit = [t0 - tc, ...tracker.split_ms()].map((v, i) => emaSplit[i] ? 0.9 * emaSplit[i] + 0.1 * v : v);
        const p = tracker.pose();

        ctx.drawImage(work.canvas, 0, 0);
        for (let i = 0; i < kps.length; i += 4) {
          ctx.strokeStyle = COLORS[kps[i + 2]];
          ctx.beginPath();
          ctx.arc(kps[i], kps[i + 1], 3 * 1.44 ** kps[i + 2], 0, 2 * Math.PI);
          ctx.stroke();
        }
        if (p.length) {
          // Floor grid (z = 0) around the start point: checks sensor rotation, FOV and delay.
          ctx.strokeStyle = "#fff8";
          ctx.beginPath();
          for (let g = -3; g <= 3; g += 0.5) { line(p, [g, -3, 0], [g, 3, 0], 24); line(p, [-3, g, 0], [3, g, 0], 24); }
          ctx.stroke();
          // Cube anchored where the view centre hit the floor when tracking started.
          if (p[0] === 1 && !anchor) {
            const R = p.slice(6, 15), dz = R[8]; // world z of the optical axis
            if (dz < -0.2) { const t = -p[5] / dz; anchor = [p[3] + R[2] * t, p[4] + R[5] * t]; }
          }
          const now = performance.now();
          if (p[0] === 1 || p[0] === 2) tracked = now;
          // Lost under 1 s (a pan, a quick cover): keep showing it, turning with the gyro from the last position.
          if (anchor && p[0] !== 0 && now - tracked < 1000) {
            const [ax, ay] = anchor, e = 0.15;
            const v = [0, 1, 2, 3, 4, 5, 6, 7].map((i) => [ax + (i & 1 ? e : -e), ay + (i & 2 ? e : -e), i & 4 ? 2 * e : 0]);
            ctx.strokeStyle = p[0] === 1 ? "#0f0" : "#fa0";
            ctx.beginPath();
            for (const [a, b] of [[0,1],[1,3],[3,2],[2,0],[4,5],[5,7],[7,6],[6,4],[0,4],[1,5],[2,6],[3,7]]) line(p, v[a], v[b]);
            ctx.stroke();
          }
        }
        const t = performance.now();
        emaMs = emaMs ? 0.9 * emaMs + 0.1 * ms : ms;
        emaFps = emaFps ? 0.9 * emaFps + 0.1 * (1000 / (t - last)) : 1000 / (t - last);
        last = t;
        hud.textContent = `${tracker.backend()} ${w}x${h} fov ${FOV} delay ${DELAY} ${VISION ? "" : "SENSOR ONLY"}${RECORD ? ` REC ${acked}/300${failed ? ` FAILED ${failed}` : ""}` : ""}\n`
          + `driver ${driver}  sensor age ${s ? (want - s.t).toFixed(0) : "-"} ms\n`
          + `keypoints ${kps.length / 4} (t ${tracker.threshold()})  detect ${emaMs.toFixed(1)} ms  fps ${emaFps.toFixed(1)}\n`
          + `copy ${emaSplit[0].toFixed(1)}  upload ${emaSplit[1].toFixed(1)}  enc ${emaSplit[2].toFixed(1)}  wait ${emaSplit[3].toFixed(1)}  track ${emaSplit[4].toFixed(1)} ms\n`
          + (emaSplit.length > 5 ? `wait: submit ${emaSplit[5].toFixed(1)} gpu ${emaSplit[6].toFixed(1)} map ${emaSplit[7].toFixed(1)} unpack ${emaSplit[8].toFixed(1)}` : "")
          + `${SRC_VIDEO ? "  src video" : ""}${LEVELS ? `  levels ${LEVELS}` : ""}${FPS ? `  ask ${FPS} fps` : ""}\n`
          + (!sensorOk ? "no orientation sensor: tracking off"
            : p.length ? `${STATES[p[0]]}  inliers ${p[1]}  map ${p[2]}\npos ${Array.from(p.slice(3, 6), (x) => x.toFixed(2)).join(" ")}  scale ${Number.isNaN(p[18]) ? (m ? "-" : "no motion sensor") : `${p[18].toFixed(2)} m/unit`}`
            : "waiting for sensor…");
        } catch (e) {
          hud.textContent = `frame error: ${e}`;
        }
        next();
      };
      // One callback per new camera frame; falls back to rAF if the browser never fires it (hidden video).
      let vfcGaveUp = false;
      setTimeout(() => { vfcGaveUp = !gotVfc; if (vfcGaveUp) requestAnimationFrame(frame); }, 500);
      const next = () => (video.requestVideoFrameCallback && !vfcGaveUp ? video.requestVideoFrameCallback(frame) : requestAnimationFrame(frame));
      next();
    } catch (e) {
      hud.textContent = `error: ${e}`;
    }
  };
</script>
