<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>webar camera</title>
<style>
  body { margin: 0; background: #000; color: #fff; font: 13px/1.4 ui-monospace, monospace; }
  canvas#view { display: block; width: 100vw; height: auto; max-height: 100vh; object-fit: contain; }
  #hud { position: fixed; top: 0; left: 0; margin: 0; padding: 6px 8px; background: #000a; white-space: pre; }
  #start { position: fixed; inset: 0; margin: auto; width: 14em; height: 3em; font: inherit; font-size: 16px; }
</style>
<video id="video" playsinline muted hidden></video>
<canvas id="view"></canvas>
<canvas id="gl" width="1" height="1" hidden></canvas>
<pre id="hud">loading…</pre>
<button id="start" hidden>Start camera</button>
<script type="module">
  import init, { Tracker } from "../pkg/webar.js";
  const $ = (id) => document.getElementById(id);
  const hud = $("hud"), video = $("video"), view = $("view");
  const MAX_SIDE = 640; // processing size; level 0 of the pyramid
  const COLORS = ["#ff3b30", "#ffcc00", "#34c759", "#0a84ff"];

  await init();
  const forceGl = new URLSearchParams(location.search).get("backend") === "webgl";
  const webgpu = !forceGl && !!navigator.gpu && !!(await navigator.gpu.requestAdapter());
  hud.textContent = `ready (${webgpu ? "webgpu" : "webgl2"}). ?backend=webgl forces WebGL2.`;
  $("start").hidden = false;

  // iOS needs a user gesture before the camera can play.
  $("start").onclick = async () => {
    $("start").hidden = true;
    try {
      video.srcObject = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false,
      });
      await video.play();
      const tracker = await Tracker.create($("gl"), webgpu);
      const k = MAX_SIDE / Math.max(video.videoWidth, video.videoHeight);
      const w = Math.round(video.videoWidth * k), h = Math.round(video.videoHeight * k);
      view.width = w; view.height = h;
      const ctx = view.getContext("2d");
      ctx.lineWidth = 2;
      // Pixels come from a hidden canvas so the visible one only ever shows a frame with its circles
      // (the browser presents during the await, which would show the frame before they are drawn).
      const work = new OffscreenCanvas(w, h).getContext("2d", { willReadFrequently: true });
      let emaMs = 0, emaFps = 0, last = performance.now();

      const frame = async () => {
        work.drawImage(video, 0, 0, w, h);
        const rgba = new Uint8Array(work.getImageData(0, 0, w, h).data.buffer);
        const t0 = performance.now();
        const kps = await tracker.detect(rgba, w, h);
        const ms = performance.now() - t0;
        ctx.drawImage(work.canvas, 0, 0);
        for (let i = 0; i < kps.length; i += 4) {
          ctx.strokeStyle = COLORS[kps[i + 2]];
          ctx.beginPath();
          ctx.arc(kps[i], kps[i + 1], 3 * 1.44 ** kps[i + 2], 0, 2 * Math.PI);
          ctx.stroke();
        }
        const now = performance.now();
        emaMs = emaMs ? 0.9 * emaMs + 0.1 * ms : ms;
        emaFps = emaFps ? 0.9 * emaFps + 0.1 * (1000 / (now - last)) : 1000 / (now - last);
        last = now;
        hud.textContent = `${tracker.backend()} ${w}x${h}\nkeypoints ${kps.length / 4}\ndetect ${emaMs.toFixed(1)} ms\nfps ${emaFps.toFixed(1)}`;
        requestAnimationFrame(frame);
      };
      requestAnimationFrame(frame);
    } catch (e) {
      hud.textContent = `error: ${e}`;
    }
  };
</script>
