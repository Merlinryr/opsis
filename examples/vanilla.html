<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>opsis + Canvas 2D</title>
<link rel="stylesheet" href="style.css">
<div id="app"><canvas id="c"></canvas></div>
<p id="status">Tap Start, then point at the floor. Tap to move the cube.</p>
<button id="start">Start</button>
<script type="module">
  import { start } from "../packages/opsis/dist/index.js";

  const canvas = document.getElementById("c"), status = document.getElementById("status"), ctx = canvas.getContext("2d");
  const s = 0.1, corners = [...Array(8)].map((_, i) => [i & 1 ? s : -s, i & 2 ? 2 * s : 0, i & 4 ? s : -s]);
  const edges = [[0, 1], [1, 3], [3, 2], [2, 0], [4, 5], [5, 7], [7, 6], [6, 4], [0, 4], [1, 5], [2, 6], [3, 7]];
  const mul = (m, [x, y, z]) => [0, 1, 2, 3].map((i) => m[i] * x + m[4 + i] * y + m[8 + i] * z + m[12 + i]);
  let anchor = null, tap = null;
  canvas.onpointerdown = (e) => (tap = [e.clientX / innerWidth, e.clientY / innerHeight]);

  document.getElementById("start").onclick = async (e) => {
    e.target.hidden = true;
    const session = await start({ mount: document.getElementById("app") }).catch((err) => (status.textContent = err));
    session.onFrame((f) => {
      const W = (canvas.width = innerWidth * devicePixelRatio), H = (canvas.height = innerHeight * devicePixelRatio), aspect = W / H;
      status.textContent = `${session.backend} · ${f.state} · map ${f.mapSize}`;
      if (!f.pose) return;
      const place = tap ?? (!anchor && f.state === "normal" ? [0.5, 0.5] : null);
      anchor = (place && f.hitTest(place[0], place[1], aspect)[0]?.position) ?? anchor;
      tap = null;
      if (!anchor) return;
      const proj = f.projectionMatrix(aspect), view = f.pose.viewMatrix;
      const screen = corners.map(([x, y, z]) => {
        const [cx, cy, , cw] = mul(proj, mul(view, [x + anchor[0], y + anchor[1], z + anchor[2]]));
        return cw > 0.01 ? [(cx / cw + 1) * W / 2, (1 - cy / cw) * H / 2] : null;
      });
      ctx.lineWidth = 3 * devicePixelRatio;
      ctx.strokeStyle = f.state === "normal" ? "#0a84ff" : "#ff9f0a";
      ctx.beginPath();
      for (const [a, b] of edges) if (screen[a] && screen[b]) (ctx.moveTo(...screen[a]), ctx.lineTo(...screen[b]));
      ctx.stroke();
    });
  };
</script>
