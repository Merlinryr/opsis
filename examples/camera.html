<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>opsis camera</title>
<link rel="stylesheet" href="style.css">
<div id="app"></div>
<p id="status">Tap Start. Params: ?backend=webgl ?fov=69 ?delay=0 ?vision=0 ?record=1 ?frames=300 ?levels=4</p>
<button id="start">Start</button>
<script type="module">
  import { start } from "../packages/opsis/dist/index.js";
  import { debug } from "../packages/opsis/dist/debug.js";

  const params = new URLSearchParams(location.search), num = (k, d) => Number(params.get(k) ?? d);
  const FOV = num("fov", 69), DELAY = num("delay", 0); // Tune both until the grid stays put when turning (fast).
  const RECORD = params.get("record") === "1"; // Uploads grey images + sensor data (start the server with -Record).
  const REC_FRAMES = num("frames", 300); // ~0.2 MB per frame.
  const status = document.getElementById("status");

  document.getElementById("start").onclick = async (e) => {
    e.target.hidden = true;
    status.hidden = true;
    const session = await start({
      mount: document.getElementById("app"),
      fov: FOV, sensorDelay: DELAY, vision: params.get("vision") !== "0", levels: num("levels", 0), backend: params.get("backend") ?? "auto",
    }).catch((err) => void ((status.hidden = false), (status.textContent = err)));
    if (!session) return;
    const hud = debug(session);
    session.onError((err) => hud.note(`frame error: ${err}`));
    if (!RECORD) return;

    let sent = 0, acked = 0, failed = 0;
    const rec = Date.now();
    session.onFrame((f) => {
      const s = f.sensor, m = f.motion, { width: w, height: h } = f.image;
      hud.note(`REC ${acked}/${REC_FRAMES}${failed ? ` FAILED ${failed}` : ""}`);
      if (!s || sent >= REC_FRAMES) return;
      // Same grey conversion as the GPU, so the replay sees exactly what the tracker saw.
      const rgba = f.image.getContext("2d").getImageData(0, 0, w, h).data, luma = new Uint8Array(w * h);
      for (let i = 0; i < luma.length; i++) luma[i] = (77 * rgba[4 * i] + 150 * rgba[4 * i + 1] + 29 * rgba[4 * i + 2]) >> 8;
      // Uploads can arrive out of order, so each carries its index and time. Count server replies, not sends.
      fetch(`/rec?s=${rec}&i=${sent++}&t=${f.time}&w=${w}&h=${h}&a=${s.alpha}&b=${s.beta}&g=${s.gamma}&fov=${FOV}${m ? `&ax=${m.x}&ay=${m.y}&az=${m.z}` : ""}`, { method: "POST", body: luma })
        .then((r) => (r.ok ? acked++ : failed++), () => failed++);
    });
  };
</script>
